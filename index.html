var mediums = ["Todos"];
DATA.forEach(function(r){ if (mediums.indexOf(r[2]) === -1) mediums.push(r[2]); });

var activeFilter = "Todos";
var listEl = document.getElementById('list');
var detailEl = document.getElementById('detail');
var qEl = document.getElementById('q');
var countEl = document.getElementById('count');
var filtersEl = document.getElementById('filters');

document.getElementById('stat-total').textContent = DATA.length;

mediums.forEach(function(m){
  var btn = document.createElement('button');
  btn.textContent = m;
  if (m === activeFilter) btn.className = 'active';
  btn.onclick = function(){
    activeFilter = m;
    Array.prototype.forEach.call(filtersEl.children, function(b){ b.className = (b.textContent === m) ? 'active' : ''; });
    render(qEl.value);
  };
  filtersEl.appendChild(btn);
});

function render(filter){
  var f = (filter || "").toLowerCase();
  var rows = DATA.filter(function(r){
    var matchesText = !f || r.join(" ").toLowerCase().indexOf(f) !== -1;
    var matchesFilter = activeFilter === "Todos" || r[2] === activeFilter;
    return matchesText && matchesFilter;
  });
  countEl.textContent = rows.length;
  listEl.innerHTML = "";
  rows.forEach(function(r){
    var idx = DATA.indexOf(r);
    var item = document.createElement('div');
    item.className = 'item';
    item.dataset.idx = idx;
    var hasAudio = localStorage.getItem('tatita_audio_' + idx) ? ' <span style="color:var(--wine); font-size:10px;">●</span>' : '';
    item.innerHTML = '<div class="meta">' + r[0] + ' · ' + r[2] + '</div><div class="title">' + r[1] + hasAudio + '</div>';
    item.onclick = function(){ selectRow(idx); };
    listEl.appendChild(item);
  });
  if (rows.length) selectRow(DATA.indexOf(rows[0]));
  else detailEl.innerHTML = '<div class="empty">Sin resultados.</div>';
}

function selectRow(idx){
  Array.prototype.forEach.call(listEl.children, function(el){
    el.className = (parseInt(el.dataset.idx) === idx) ? 'item selected' : 'item';
  });
  var r = DATA[idx];
  var year = r[0], title = r[1], medio = r[2], rol = r[3], elenco = r[4], img = r[5], link = r[6];

  var imgBlock = '';
  if (img && img.indexOf('http') === 0) {
    var direct = driveDirect(img);
    imgBlock = '<div class="imgwrap"><img src="' + direct + '" onerror="this.parentElement.innerHTML=\'<div class=placeholder>No se pudo cargar la imagen (revisar permisos de Drive)</div>\'"></div>';
  } else if (img) {
    imgBlock = '<div class="imgwrap"><div class="placeholder">' + img + '<br><br>pendiente de subir</div></div>';
  }

  var linksHtml = '';
  if (link) {
    var parts = link.split('|').map(function(s){ return s.trim(); }).filter(Boolean);
    linksHtml = '<div class="links-row">';
    parts.forEach(function(url, i){
      var label = parts.length > 1 ? ('Enlace ' + (i+1) + ' ↗') : 'Ver enlace relacionado ↗';
      linksHtml += '<a class="link" href="' + url + '" target="_blank">' + label + '</a>';
    });
    linksHtml += '</div>';
  }

  var html = '';
  html += '<span class="tag">' + medio + '</span><span class="year">' + year + '</span>';
  html += '<h2>' + title + '</h2>';
  if (rol) html += '<div class="rol">Rol: ' + rol + '</div>'; else html += '<div style="margin-bottom:16px"></div>';
  html += imgBlock;
  if (elenco) html += '<div class="section"><h3>Elenco / ficha</h3><p>' + elenco + '</p></div>';
  html += linksHtml;
  html += audioBoxHtml(idx);

  detailEl.innerHTML = html;
  wireAudioBox(idx);
}

function driveDirect(url) {
  var match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (match) return 'https://drive.google.com/uc?export=view&id=' + match[1];
  return url;
}

var mediaRecorder = null;
var audioChunks = [];
var recordingIdx = null;

function audioKey(idx){ return 'tatita_audio_' + idx; }

function audioBoxHtml(idx){
  var saved = localStorage.getItem(audioKey(idx));
  var playerHtml = saved
    ? '<audio controls src="' + saved + '"></audio><button class="del-btn" id="del-audio">Eliminar</button>'
    : '<span style="font-size:12px; color:rgba(28,43,58,0.5); font-style:italic;">Sin comentario grabado</span>';
  return '<div class="audio-box">' +
    '<h3>Comentario de Soledad Silveyra</h3>' +
    '<div class="audio-controls">' +
      '<button class="rec-btn" id="rec-btn"><span class="dot"></span><span id="rec-label">Grabar</span></button>' +
      '<span id="audio-player">' + playerHtml + '</span>' +
    '</div>' +
  '</div>';
}

function wireAudioBox(idx){
  var btn = document.getElementById('rec-btn');
  var label = document.getElementById('rec-label');
  var playerWrap = document.getElementById('audio-player');

  var delBtn = document.getElementById('del-audio');
  if (delBtn) {
    delBtn.onclick = function(){
      localStorage.removeItem(audioKey(idx));
      playerWrap.innerHTML = '<span style="font-size:12px; color:rgba(28,43,58,0.5); font-style:italic;">Sin comentario grabado</span>';
      var li = listEl.querySelector('[data-idx="' + idx + '"] .title span');
      if (li) li.remove();
    };
  }

  btn.onclick = function(){
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('Este navegador no permite grabar audio, o el archivo se abrió directamente sin servidor (protocolo file://). Subilo a un hosting o abrilo por localhost.');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
      audioChunks = [];
      recordingIdx = idx;
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = function(e){ audioChunks.push(e.data); };
      mediaRecorder.onstop = function(){
        var blob = new Blob(audioChunks, { type: 'audio/webm' });
        var reader = new FileReader();
        reader.onloadend = function(){
          localStorage.setItem(audioKey(recordingIdx), reader.result);
          var listItem = listEl.querySelector('[data-idx="' + recordingIdx + '"] .title');
          if (listItem && listItem.textContent.indexOf('●') === -1) {
            listItem.innerHTML += ' <span style="color:var(--wine); font-size:10px;">●</span>';
          }
          if (recordingIdx === idx) {
            playerWrap.innerHTML = '<audio controls src="' + reader.result + '"></audio><button class="del-btn" id="del-audio">Eliminar</button>';
            document.getElementById('del-audio').onclick = function(){
              localStorage.removeItem(audioKey(idx));
              playerWrap.innerHTML = '<span style="font-size:12px; color:rgba(28,43,58,0.5); font-style:italic;">Sin comentario grabado</span>';
              var li = listEl.querySelector('[data-idx="' + idx + '"] .title span');
              if (li) li.remove();
            };
          }
        };
        reader.readAsDataURL(blob);
        stream.getTracks().forEach(function(t){ t.stop(); });
        btn.classList.remove('recording');
        label.textContent = 'Grabar';
      };
      mediaRecorder.start();
      btn.classList.add('recording');
      label.textContent = 'Detener';
    }).catch(function(err){
      alert('No se pudo acceder al micrófono: ' + err.message);
    });
  };
}

qEl.addEventListener('input', function(e){ render(e.target.value); });
render("");
